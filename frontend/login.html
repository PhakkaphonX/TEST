<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Thai Food Analysis</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">
    <!-- Navigation (Minimal) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-cup-hot-fill me-2"></i>
                <span>ThaiFood AI</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 col-lg-4">
                    <!-- Login Card -->
                    <div class="card shadow-lg border-0">
                        <div class="card-body p-4">
                            <!-- Header -->
                            <div class="text-center mb-4">
                                <div class="login-icon mb-3">
                                    <i class="bi bi-person-circle display-1 text-primary"></i>
                                </div>
                                <h3 class="fw-bold">Welcome Back</h3>
                                <p class="text-muted">Sign in to your account</p>
                            </div>

                            <!-- Login Form -->
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="email"
                                            placeholder="Enter your email" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" id="password"
                                            placeholder="Enter your password" required>
                                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                                    <span class="normal-text">
                                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                                    </span>
                                    <span class="loading-text d-none">
                                        <span class="spinner-border spinner-border-sm me-2"></span>
                                        Signing in...
                                    </span>
                                </button>
                            </form>

                            <!-- Error Message -->
                            <div id="errorMessage" class="alert alert-danger mt-3 d-none">
                                <i class="bi bi-exclamation-triangle me-2"></i>
                                <span id="errorText">Invalid email or password</span>
                            </div>

                            <!-- Divider -->
                            <div class="divider my-4">
                                <span class="text-muted">or</span>
                            </div>

                            <!-- Guest Access -->
                            <button id="guestBtn" class="btn btn-outline-secondary w-100 mb-3">
                                <i class="bi bi-person me-2"></i>Continue as Guest
                            </button>

                            <!-- Links -->
                            <div class="text-center">
                                <p class="mb-0">
                                    Don't have an account?
                                    <a href="register.html" class="text-primary">Sign up</a>
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Back to Home -->
                    <div class="text-center mt-3">
                        <a href="index.html" class="text-muted text-decoration-none">
                            <i class="bi bi-arrow-left me-2"></i>Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Config -->
    <script src="js/config.js"></script>
    <!-- Main JS -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
